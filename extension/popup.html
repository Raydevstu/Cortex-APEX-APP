<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CortexOS</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <span class="logo" aria-hidden="true"></span>
    <div>
      <h1>CortexOS</h1>
      <p id="status">checking daemon…</p>
    </div>
  </header>

  <section class="panel">
    <label for="project">Project</label>
    <select id="project" disabled>
      <option value="">— loading —</option>
    </select>

    <label for="engine">Rewrite engine</label>
    <select id="engine" disabled>
      <option value="fast">fast — deterministic (&lt;50ms)</option>
      <option value="deep">deep — local Ollama</option>
      <option value="cloud">cloud — GLM refinement</option>
      <option value="preexec">pre-exec agent — local tools, 0 cloud tokens</option>
    </select>

    <label for="platform">Handoff target</label>
    <select id="platform" disabled>
      <option value="codex">codex</option>
      <option value="hermes">hermes</option>
      <option value="opencode">opencode</option>
      <option value="cursor">cursor</option>
      <option value="windsurf">windsurf</option>
      <option value="claude">claude</option>
      <option value="chatgpt">chatgpt</option>
      <option value="local_ollama">local_ollama</option>
    </select>
  </section>

  <section class="panel">
    <p class="hint">On any AI chat page, type your raw prompt then press <kbd>Ctrl/Cmd+Shift+Space</kbd> to rewrite it in place — or use the buttons below.</p>
    <button id="rewrite" class="primary" disabled>Rewrite focused page's input</button>
    <button id="copyPacket" disabled>Copy sync packet to clipboard</button>
    <button id="captureClipboard" disabled>Capture clipboard as interaction</button>
  </section>

  <footer>
    <a href="#" id="openDaemon">Open Command Center ↗</a>
    <a href="#" id="openOptions">Settings</a>
  </footer>

  <script src="lib/core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
